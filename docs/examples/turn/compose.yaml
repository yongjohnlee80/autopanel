# A TURN relay (coturn) that authenticates with a shared secret: the
# application that hands out TURN credentials makes them from it, so the relay
# keeps no list of users.
#
# Copy this folder to /etc/autopanel/stacks/turn, put the secret into
# turnserver.conf (chmod 600), set your realm below, and add the stack in the
# panel: Services > Add a stack.
#
# Open 3478 (UDP and TCP) and the relay range (UDP) in your firewall.
services:
  relay:
    # coturn 4.18.0, every architecture, by digest.
    image: docker.io/coturn/coturn@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    # The host's network: a relay hands out hundreds of UDP ports, and each one
    # forwarded through a rootless container's port forwarder costs more than
    # the separation is worth for a relay. Nothing is published on the host's
    # network, so "ports" declares what the relay listens on.
    network_mode: host
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49999:49152-49999/udp"
    # The stack's own user on the host: it reads turnserver.conf, which no
    # other user of the host can.
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    restart: unless-stopped
    # The image's turnserver carries NET_BIND_SERVICE as a file capability, and
    # the kernel refuses to run such a file when the capability is dropped. The
    # relay holds it inside its own user namespace, where it opens no port of
    # the host's below 1024.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Every setting but the secret is here, not in the file: coturn starts on
    # its defaults when it cannot read its file, and its defaults are a relay
    # that asks for no credentials. Set up this way, a relay that lost its file
    # has no secret and serves nobody.
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49999
      - --realm=turn.example.com
      - --use-auth-secret
      - --fingerprint
      - --no-tls
      - --no-multicast-peers
      # The relay refuses to relay to this host and to private and link-local
      # networks: it cannot be used to reach what the host can and the internet
      # cannot.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      # The container's root is read-only: what coturn writes goes to /tmp.
      - --log-file=stdout
      - --pidfile=/tmp/turnserver.pid
      - --userdb=/tmp/turndb
